name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.framework }}, ${{ matrix.platform }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        framework:
          - net48
          - net10.0-windows10.0.26100.0
        platform:
          - x86
          - x64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Restore the complete project graph
        shell: pwsh
        run: |
          $solutionDirectory = Join-Path $env:GITHUB_WORKSPACE "source\"
          $runtimeIdentifiers = '-p:RuntimeIdentifiers="win-x86;win-x64;win-arm64"'
          dotnet restore "source\SylphyHorn.Tests\SylphyHorn.Tests.csproj" `
            -p:Configuration=Release `
            -p:Platform=${{ matrix.platform }} `
            $runtimeIdentifiers `
            -p:RuntimeIdentifier=win-${{ matrix.platform }} `
            -p:RunSylphyHornPostBuild=false `
            -p:SolutionDir="$solutionDirectory" `
            --locked-mode

      - name: Run unit tests
        shell: pwsh
        run: |
          $solutionDirectory = Join-Path $env:GITHUB_WORKSPACE "source\"
          dotnet test "source\SylphyHorn.Tests\SylphyHorn.Tests.csproj" `
            -c Release `
            -f ${{ matrix.framework }} `
            -p:Platform=${{ matrix.platform }} `
            -p:RunSylphyHornPostBuild=false `
            -p:SolutionDir="$solutionDirectory" `
            --no-restore

  windows-integration-tests:
    name: Non-interactive Windows integration tests
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.302

      - name: Run environment-independent integration tests
        shell: pwsh
        run: |
          & ".github\scripts\RunHostedIntegrationTests.ps1" `
            -ResultsDirectory (Join-Path $env:RUNNER_TEMP "HostedCI-results")
